# Builds the Android app (APK) and publishes it as a GitHub release, so it can be downloaded on a phone.
# The app is a thin wrapper around https://teeco-estate.vercel.app (see mobile/), so web changes reach it
# without a new APK; rebuild only when mobile/ changes.
name: Android APK

on:
  push:
    branches: [teeco/main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Generate the Android project
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: npm run android:prepare

      - name: Build the APK
        run: |
          mkdir -p ~/.android
          cp signing/teeco-demo.keystore ~/.android/debug.keystore
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../myestateapp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: myestateapp-apk
          path: mobile/myestateapp.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v1.0.${{ github.run_number }}"
          gh release create "$tag" myestateapp.apk \
            --target "${{ github.sha }}" \
            --title "MyEstateapp for Android 1.0.${{ github.run_number }}" \
            --notes "Download **myestateapp.apk** on your Android phone, open it and allow installing from this source. The app opens https://teeco-estate.vercel.app; sign in with your phone number as usual."
